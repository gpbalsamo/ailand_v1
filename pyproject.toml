[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ailand"
version = "0.1.0"
description = "aiLand v0 - XGBoost emulator of the ecLand land surface model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "xarray",
    "zarr",
    "dask",
    "xgboost",
    "scikit-learn",
    "matplotlib",
    "netCDF4",
]

[project.optional-dependencies]
# v1_anemoi branch: reimplements the aiLand pipeline on ECMWF's own
# anemoi-training stack instead of the hand-rolled src/ailand/mlp.py.
# See docs/ANEMOI.md.
anemoi = [
    "anemoi-training==0.17.0",
    "anemoi-models==0.19.0",
    "anemoi-graphs==0.9.7",
    "anemoi-datasets==0.5.43",
]

[tool.setuptools.packages.find]
where = ["src"]
