# Phase 1 (R=4). ailand.mlp.AiLandMLP conditions only on the CURRENT state +
# forcing (no lookback window), unlike anemoi's usual multistep_input=2 --
# so multistep_input=1 here to match. Phase 2 overrides `rollout.start`/
# `rollout.maximum` to 8 via a CLI override (see
# training/ailand_pretrain.yaml's header comment and slurm/anemoi_train.sh).
_target_: anemoi.training.tasks.Forecaster
multistep_input: 1
multistep_output: 1
timestep: "6h"

rollout:
  start: 4
  epoch_increment: 0  # fixed at 4 for all of Phase 1; Phase 2 is a separate run at 8
  maximum: 4

validation_rollout: null
