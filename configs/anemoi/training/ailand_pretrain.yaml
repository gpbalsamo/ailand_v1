# Phase 1 (R=4) pretraining, adapted from the shipped training/single.yaml.
# Phase 2 (R=8, 8 epochs) is a second run resuming from this one's checkpoint
# with `+task=ailand_forecaster_r8 training.transfer_learning=True
# system.input.warm_start=<phase1 checkpoint>` -- see slurm/anemoi_train.sh
# and docs/ANEMOI.md. anemoi-training's RolloutConfig can grow the rollout
# automatically within one run (`epoch_increment`), but v1's own two distinct
# epoch counts per phase (80 then 8) map more directly onto two runs than one
# schedule, so that's what this does.
defaults:
  - scalers: ailand
  - training_loss: ailand
  - optimization: default
  - weight_averaging: null
  - _self_

run_id: null
fork_run_id: null
transfer_learning: False
load_weights_only: False
update_ds_stats_on_ckpt_load:
  states: False
  tendencies: True

check_variables_compatibility:
  ignore_units: False
  ignore_processing_period: False

deterministic: False
precision: 16-mixed
accum_grad_batches: 1
num_sanity_val_steps: 6

# v1: gradient clipping at global norm 5.0 (shipped default is norm-free
# value-clipping at 32).
gradient_clip:
  val: 5.0
  algorithm: norm

method:
  _target_: anemoi.training.train.methods.SingleTraining

strategy:
  _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
  num_gpus_per_model: ${system.hardware.num_gpus_per_model}
  read_group_size: ${dataloader.read_group_size}
  use_local_synchronization: True
  broadcast_buffers: False

loss_gradient_scaling: False

validation_metrics:
  datasets:
    data:
      mse:
        _target_: anemoi.training.losses.MSELoss
        scalers: ["node_weights", "time_steps"]
        ignore_nans: True

# No pressure levels / atmospheric grouping in a land-surface state -- one
# default group for everything.
variable_groups:
  datasets:
    data:
      default: sfc

metrics:
  datasets:
    data:
      - stl1
      - swvl1
      - snowc
      - slhf
      - sshf

# Phase 1: R=4, 80 epochs (mirrors slurm/reproduce_v1.sh's Phase 1).
# max_steps must be a concrete int even when max_epochs governs the actual
# stop (training.SingleTraining's schema rejects null) -- set generously
# high so max_epochs is always the binding limit; Lightning stops at
# whichever of the two is reached first.
max_epochs: 80
max_steps: 10000000

submodules_to_freeze: []

# v1: Adam peak LR 5e-4 -> 3e-7 cosine, 1000-step warmup. The shipped cosine
# scheduler's lr_min (3e-7) is ALREADY this value by default
# (training/optimization/lr_scheduler/cosine_scheduler.yaml) -- only the
# peak `lr` (default 0.625e-4) needs raising to 5e-4.
#
# CONFIRMED BUG, caught after ~4 GPU-hours on job 35721973: `t_in_epochs:
# true` with `t_initial: 80` means "80 units, each unit an epoch" -- but
# training/optimization/default.yaml's `pl_lr_scheduler.interval: step`
# (unchanged, inherited) makes Lightning call `scheduler.step()` on every
# training STEP, passing the cumulative step count. timm's CosineLRScheduler
# takes whatever integer it's given as the literal unit count against
# t_initial, with no unit conversion -- confirmed directly:
#   sched.step(80) -> lr == lr_min already (3e-7)
# So by ~80 steps into epoch 0 (out of many thousands of total steps for a
# dataset this size), the LR had already collapsed to 3e-7 and stayed there
# for the entire rest of the run -- 38 epochs of an almost dead-flat loss
# (train_multi_dataset_loss_epoch pinned at 1.66e5 for the whole log) is
# exactly what that produces. Fixed by making `pl_lr_scheduler.interval`
# match `t_in_epochs: true`: `epoch`, not the default `step`. Lightning then
# calls `.step()` once per epoch with the epoch index, which is what
# `t_in_epochs` actually assumes.
optimization:
  lr: 5.0e-4
  pl_lr_scheduler:
    interval: epoch
  lr_scheduler:
    t_in_epochs: true
    t_initial: ${training.max_epochs}
    warmup_t: 2
